<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spanish Speak Yet</title>
<style>
:root{
  --ink:#1b2340; --ink2:#3a4470; --paper:#f1f4f8; --card:#ffffff; --line:#d9dfe9;
  --gold:#f0a92b; --gold-d:#c98512; --ok:#17916a; --bad:#d1403a; --muted:#6a7390;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-family:Georgia,"Times New Roman",serif;font-size:2rem;margin:8px 0 0;letter-spacing:.01em}
h2{font-size:1.1rem;margin:24px 0 8px}
.sub{color:var(--muted);margin:2px 0 20px}
.stripe{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--bad) 0 25%,var(--gold) 25% 75%,var(--bad) 75%);margin-bottom:6px;width:72px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{display:block;width:100%;padding:14px 16px;border-radius:var(--r);font-weight:700;text-align:center}
.btn.primary{background:var(--ink);color:#fff;font-size:1.15rem;padding:18px}
.btn.primary:active{background:var(--ink2)}
.btn.ghost{background:var(--card);border:1.5px solid var(--line)}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:.9rem}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.4}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.6;font-weight:400;margin-left:4px;font-size:.85em}
.card{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.stack>*+*{margin-top:12px}
.note{color:var(--muted);font-size:.88rem}
.warn{background:#fff4dc;border:1px solid #f1d28b;border-radius:12px;padding:10px 12px;font-size:.9rem}
input[type=text],textarea,select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}

/* play */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-weight:700}
.q{text-align:center;padding:28px 16px}
.q .cat{color:var(--muted);font-size:.85rem}
.q .ja{font-size:1.7rem;font-weight:800;margin:10px 0 4px;line-height:1.35}
.q .es{font-family:Georgia,serif;font-style:italic;font-size:1.5rem;color:var(--ok);margin-top:14px}
.q .es.bad{color:var(--bad)}
.mic{display:block;margin:26px auto 8px;width:116px;height:116px;border-radius:50%;background:var(--ink);color:#fff;font-size:2.6rem;position:relative}
.mic:active{background:var(--ink2)}
.mic.live{background:var(--bad)}
.mic.live::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--bad);animation:pulse 1.1s infinite}
@keyframes pulse{from{transform:scale(.9);opacity:.9}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic.live::after{animation:none}.bar i{transition:none}}
.mictext{text-align:center;color:var(--muted);font-weight:600}
.heard{min-height:1.6em;text-align:center;font-family:Georgia,serif;font-size:1.15rem;margin-top:10px;color:var(--ink2)}
.verdict{font-size:3rem;font-weight:800;line-height:1}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}

/* result */
.score{text-align:center;padding:28px 16px}
.score .big{font-family:Georgia,serif;font-size:4.5rem;font-weight:700;line-height:1}
.score .big small{font-size:1.6rem;color:var(--muted)}
.miss{border-top:1px solid var(--line);padding:10px 0}
.miss:first-child{border-top:0}
.miss .es{font-family:Georgia,serif;font-style:italic}

/* manage */
.pl{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl .t{flex:1;min-width:0}
.pl .es{font-family:Georgia,serif;font-style:italic;word-break:break-word}
.pl .ja{color:var(--muted);font-size:.9rem}
.ic{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ データ保存 ============ */
const KEY = 'spanishSpeakYet.v1';
const uid = () => Math.random().toString(36).slice(2, 9);

function defaultData(){
  const mk = (name, arr) => ({id: uid(), name, phrases: arr.map(([es, ja]) => ({id: uid(), es, ja}))});
  return {
    settings: {level: 'normal'},
    cats: [
      mk('あいさつ', [
        ['Buenos días','おはよう'],['¿Cómo estás?','元気ですか？'],['Mucho gusto','はじめまして'],
        ['Hasta luego','またあとで'],['Muchas gracias','どうもありがとう']]),
      mk('レストラン', [
        ['La cuenta, por favor','お会計をお願いします'],['Quisiera una mesa para dos','2人のテーブルをお願いします'],
        ['¿Qué me recomienda?','おすすめは何ですか？'],['Está muy rico','とてもおいしいです'],['Un agua, por favor','お水をください']]),
      mk('旅行', [
        ['¿Dónde está el baño?','トイレはどこですか？'],['¿Cuánto cuesta?','いくらですか？'],
        ['No entiendo','わかりません'],['¿Habla inglés?','英語を話せますか？'],['Necesito ayuda','助けが必要です']])
    ]
  };
}
let mem = null;
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const d = JSON.parse(r); if(d && d.cats) return d; } }catch(e){}
  return mem || defaultData();
}
let store = load();
function save(){ mem = store; try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

/* ============ 小道具 ============ */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for(const [k, v] of Object.entries(props || {})){
    if(k === 'class') el.className = v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if(v === true) el.setAttribute(k, '');
    else if(v !== false && v != null) el.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if(c == null || c === false) return; el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
const app = document.getElementById('app');
const mount = el => { app.replaceChildren(el); window.scrollTo(0, 0); };
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ============ 音 ============ */
let actx = null;
function ensureAudio(){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
  }catch(e){}
}
function tone(freq, start, dur, type, vol){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  const t = actx.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const soundOk  = () => { ensureAudio(); tone(880, 0, .18, 'sine', .35); tone(1318, .16, .35, 'sine', .35); };
const soundBad = () => { ensureAudio(); tone(180, 0, .45, 'square', .22); };

function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES'; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ 判定 ============ */
const NUM = {'0':'cero','1':'uno','2':'dos','3':'tres','4':'cuatro','5':'cinco','6':'seis','7':'siete','8':'ocho','9':'nueve','10':'diez'};
function norm(s){
  s = (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
  return s.split(' ').map(w => NUM[w] || w).join(' ');
}
function lev(a, b){
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length: n + 1}, (_, i) => i);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function similarity(a, b){
  a = norm(a); b = norm(b);
  const L = Math.max(a.length, b.length);
  return L ? 1 - lev(a, b) / L : 0;
}
const LEVELS = {strict: {label: '厳しい（ほぼ完全一致）', th: 0.95}, normal: {label: 'ふつう', th: 0.85}, loose: {label: 'ゆるい', th: 0.72}};

/* ============ 状態 ============ */
let selected = new Set(store.cats.map(c => c.id));
let manageCat = store.cats[0] ? store.cats[0].id : null;
let game = null, rec = null, nextTimer = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* ============ ホーム ============ */
function viewHome(){
  selected = new Set([...selected].filter(id => store.cats.some(c => c.id === id)));
  const pool = store.cats.filter(c => selected.has(c.id)).reduce((n, c) => n + c.phrases.length, 0);
  const allOn = store.cats.length > 0 && selected.size === store.cats.length;

  const chips = [
    h('button', {class: 'chip' + (allOn ? ' on' : ''), onclick: () => {
      selected = allOn ? new Set() : new Set(store.cats.map(c => c.id)); viewHome();
    }}, 'すべて'),
    ...store.cats.map(c => h('button', {class: 'chip' + (selected.has(c.id) ? ' on' : ''), onclick: () => {
      selected.has(c.id) ? selected.delete(c.id) : selected.add(c.id); viewHome();
    }}, c.name, h('span', {class: 'n'}, c.phrases.length)))
  ];

  mount(h('div', {class: 'stack'},
    h('div', {}, h('div', {class: 'stripe'}), h('h1', {}, 'Spanish Speak Yet'), h('p', {class: 'sub'}, '日本語を見て、スペイン語を声に出そう。1回15問。')),
    !SR && h('div', {class: 'warn'}, 'このブラウザは音声認識に対応していません。入力モードで遊べます（Chrome推奨）。'),
    h('div', {class: 'card stack'},
      h('div', {}, h('strong', {}, '出題するカテゴリ'), h('div', {class: 'note'}, 'タップで選択／解除')),
      store.cats.length ? h('div', {class: 'chips'}, chips) : h('div', {class: 'note'}, 'カテゴリがありません。「フレーズ管理」から追加してください。'),
      h('div', {class: 'note'}, `出題候補：${pool}フレーズ` + (pool > 0 && pool < 15 ? `（15未満なので${pool}問になります）` : ''))
    ),
    h('button', {class: 'btn primary', disabled: pool === 0, onclick: startGame}, 'スタート'),
    h('button', {class: 'btn ghost', onclick: viewManage}, 'フレーズ・カテゴリ管理')
  ));
}

/* ============ ゲーム ============ */
function startGame(){
  ensureAudio();
  const pool = [];
  store.cats.filter(c => selected.has(c.id)).forEach(c => c.phrases.forEach(p => pool.push({...p, cat: c.name})));
  if(!pool.length) return;
  game = {qs: shuffle(pool).slice(0, 15), i: 0, results: [], phase: 'idle', heard: '', msg: '', typed: !SR, last: null};
  viewPlay();
}
function stopRec(){ if(rec){ try{ rec.onend = rec.onerror = rec.onresult = null; rec.abort(); }catch(e){} rec = null; } }
function quitGame(){ clearTimeout(nextTimer); stopRec(); try{ speechSynthesis.cancel(); }catch(e){} game = null; viewHome(); }

function viewPlay(){
  const q = game.qs[game.i], total = game.qs.length, judged = game.phase === 'judged';
  const live = game.phase === 'listening';
  const kids = [
    h('div', {class: 'top'},
      h('button', {class: 'btn ghost small', onclick: () => { if(confirm('ゲームをやめますか？')) quitGame(); }}, '←'),
      h('div', {class: 'bar'}, h('i', {style: `width:${(game.i + (judged ? 1 : 0)) / total * 100}%`})),
      h('span', {class: 'count'}, `${game.i + 1}/${total}`)),
    h('div', {class: 'card q'},
      h('div', {class: 'cat'}, q.cat),
      h('div', {class: 'ja'}, q.ja),
      judged && h('div', {class: 'verdict ' + (game.last.ok ? 'ok' : 'bad')}, game.last.ok ? '○' : '×'),
      judged && h('div', {class: 'es' + (game.last.ok ? '' : ' bad')}, q.es)
    )
  ];

  if(!judged){
    if(!game.typed){
      kids.push(
        h('button', {class: 'mic' + (live ? ' live' : ''), id: 'mic', 'aria-label': live ? '停止' : '話す', onclick: live ? stopListening : listen}, live ? '■' : '🎤'),
        h('div', {class: 'mictext'}, live ? '聞いています…' : 'タップして話す'),
        h('div', {class: 'heard', id: 'heard'}, game.heard),
        game.msg && h('div', {class: 'note', style: 'text-align:center'}, game.msg)
      );
    }else{
      const inp = h('input', {type: 'text', id: 'typed', placeholder: 'スペイン語を入力', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false'});
      inp.addEventListener('keydown', e => { if(e.key === 'Enter') judge([inp.value]); });
      kids.push(h('div', {class: 'stack', style: 'margin-top:14px'},
        game.msg && h('div', {class: 'warn'}, game.msg),
        inp,
        h('button', {class: 'btn primary', onclick: () => judge([inp.value])}, '答える')));
    }
    kids.push(h('div', {class: 'row wrap', style: 'justify-content:center;margin-top:18px'},
      h('button', {class: 'btn ghost small', onclick: () => speak(q.es)}, '🔊 お手本'),
      SR && h('button', {class: 'btn ghost small', onclick: () => { stopRec(); game.typed = !game.typed; game.phase = 'idle'; game.msg = ''; viewPlay(); }}, game.typed ? '🎤 声で答える' : '⌨ 入力で答える'),
      h('button', {class: 'btn ghost small', onclick: () => judge([''], true)}, 'スキップ')));
  }else{
    kids.push(
      game.last.heard && h('div', {class: 'heard'}, `認識：${game.last.heard}`),
      h('div', {class: 'row', style: 'margin-top:16px'},
        h('button', {class: 'btn ghost', style: 'width:auto;padding:14px 18px', onclick: () => speak(q.es)}, '🔊'),
        h('button', {class: 'btn primary grow', onclick: next}, game.i + 1 >= total ? '結果を見る' : '次へ')));
  }
  mount(h('div', {}, kids));
  if(game.typed && !judged){ const t = document.getElementById('typed'); if(t) t.focus(); }
}

function listen(){
  ensureAudio();
  if(!SR){ game.typed = true; viewPlay(); return; }
  stopRec();
  game.heard = ''; game.msg = '';
  let finals = null, err = '';
  rec = new SR();
  rec.lang = 'es-ES'; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
  rec.onresult = e => {
    const r = e.results[e.results.length - 1];
    const el = document.getElementById('heard');
    if(el) el.textContent = r[0].transcript;
    game.heard = r[0].transcript;
    if(r.isFinal) finals = Array.from(r).map(a => a.transcript);
  };
  rec.onerror = e => { err = e.error; };
  rec.onend = () => {
    rec = null;
    if(!game) return;
    if(finals){ judge(finals); return; }
    game.phase = 'idle';
    if(err === 'not-allowed' || err === 'service-not-allowed'){
      game.typed = true;
      game.msg = 'マイクが許可されていません。ブラウザのマイク許可を確認してください（今回は入力で答えられます）。';
    }else if(err === 'network'){
      game.msg = 'ネットワークエラー：音声認識にはネット接続が必要です。';
    }else if(err === 'audio-capture'){
      game.msg = 'マイクが見つかりません。';
    }else{
      game.msg = '聞き取れませんでした。もう一度タップしてください。';
    }
    viewPlay();
  };
  try{ rec.start(); game.phase = 'listening'; viewPlay(); }
  catch(e){ game.phase = 'idle'; game.msg = '音声認識を開始できませんでした。'; viewPlay(); }
}
function stopListening(){ if(rec){ try{ rec.stop(); }catch(e){} } }

function judge(alts, skipped){
  stopRec();
  if(!game || game.phase === 'judged') return;
  const q = game.qs[game.i];
  const th = LEVELS[store.settings.level || 'normal'].th;
  let best = 0, bestText = '';
  alts.forEach(t => { const s = similarity(t, q.es); if(s > best){ best = s; bestText = t; } });
  const ok = !skipped && best >= th;
  if(!bestText) bestText = alts[0] || '';
  game.results.push({q, ok, heard: skipped ? '' : bestText});
  game.last = {ok, heard: skipped ? '' : bestText};
  game.phase = 'judged';
  ok ? soundOk() : soundBad();
  viewPlay();
  if(ok) nextTimer = setTimeout(() => { if(game && game.phase === 'judged') next(); }, 1300);
}
function next(){
  clearTimeout(nextTimer);
  if(game.i + 1 >= game.qs.length){ viewResult(); return; }
  game.i++; game.phase = 'idle'; game.heard = ''; game.msg = ''; game.last = null;
  viewPlay();
}

/* ============ 結果 ============ */
function viewResult(){
  const total = game.qs.length, score = game.results.filter(r => r.ok).length;
  const pct = Math.round(score / total * 100);
  const msg = pct === 100 ? '¡Perfecto! 全問正解！' : pct >= 80 ? '¡Muy bien! すばらしい' : pct >= 50 ? 'もう少し！復習すればもっと伸びます' : 'まずは声に出す練習から。また挑戦しよう';
  const misses = game.results.filter(r => !r.ok);
  mount(h('div', {class: 'stack'},
    h('div', {class: 'card score'},
      h('div', {class: 'big'}, score, h('small', {}, ` / ${total}`)),
      h('div', {style: 'font-weight:700;margin-top:10px'}, `${pct}点`),
      h('div', {class: 'note', style: 'margin-top:4px'}, msg)),
    misses.length > 0 && h('div', {class: 'card'},
      h('strong', {}, '間違えたフレーズ'),
      misses.map(m => h('div', {class: 'miss'},
        h('div', {class: 'ja note'}, m.q.ja),
        h('div', {class: 'row'},
          h('div', {class: 'es grow'}, m.q.es),
          h('button', {class: 'ic', 'aria-label': '発音', onclick: () => speak(m.q.es)}, '🔊')),
        m.heard && h('div', {class: 'note'}, `あなた：${m.heard}`)))),
    h('button', {class: 'btn primary', onclick: startGame}, 'もう一度（同じカテゴリ）'),
    h('button', {class: 'btn ghost', onclick: () => { game = null; viewHome(); }}, 'ホームへ')
  ));
}

/* ============ 管理 ============ */
function viewManage(){
  if(!store.cats.some(c => c.id === manageCat)) manageCat = store.cats[0] ? store.cats[0].id : null;
  const cat = store.cats.find(c => c.id === manageCat);

  const esIn = h('input', {type: 'text', placeholder: 'スペイン語（例：¿Dónde está el baño?）', autocapitalize: 'off', spellcheck: 'false'});
  const jaIn = h('input', {type: 'text', placeholder: '日本語の意味（例：トイレはどこですか？）'});
  const addOne = () => {
    if(!cat) return alert('先にカテゴリを作ってください');
    const es = esIn.value.trim(), ja = jaIn.value.trim();
    if(!es || !ja) return alert('スペイン語と日本語の両方を入力してください');
    cat.phrases.push({id: uid(), es, ja}); save(); viewManage();
  };
  jaIn.addEventListener('keydown', e => { if(e.key === 'Enter') addOne(); });

  const bulk = h('textarea', {placeholder: '1行に1フレーズ\nスペイン語 | 日本語\nBuenos días | おはよう'});
  const addBulk = () => {
    if(!cat) return alert('先にカテゴリを作ってください');
    let n = 0;
    bulk.value.split('\n').forEach(line => {
      const parts = line.split(/[|｜\t]/);
      if(parts.length >= 2 && parts[0].trim() && parts[1].trim()){ cat.phrases.push({id: uid(), es: parts[0].trim(), ja: parts[1].trim()}); n++; }
    });
    if(!n) return alert('「スペイン語 | 日本語」の形式で入力してください');
    save(); viewManage();
  };

  const level = h('select', {onchange: e => { store.settings.level = e.target.value; save(); }},
    Object.entries(LEVELS).map(([k, v]) => h('option', {value: k, selected: (store.settings.level || 'normal') === k}, v.label)));

  const fileIn = h('input', {type: 'file', accept: '.json,application/json', style: 'display:none', onchange: e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!d.cats || !Array.isArray(d.cats)) throw 0;
        if(!confirm('現在のデータを、読み込んだデータで置き換えますか？')) return;
        store = d; if(!store.settings) store.settings = {level: 'normal'};
        selected = new Set(store.cats.map(c => c.id)); manageCat = store.cats[0] && store.cats[0].id; save(); viewManage();
      }catch(err){ alert('読み込めませんでした。バックアップファイルを確認してください。'); }
    };
    r.readAsText(f);
  }});

  mount(h('div', {class: 'stack'},
    h('div', {class: 'top'},
      h('button', {class: 'btn ghost small', onclick: viewHome}, '← ホーム'),
      h('h2', {style: 'margin:0'}, 'フレーズ・カテゴリ管理')),

    h('div', {class: 'card stack'},
      h('strong', {}, 'カテゴリ'),
      h('div', {class: 'chips'},
        store.cats.map(c => h('button', {class: 'chip' + (c.id === manageCat ? ' on' : ''), onclick: () => { manageCat = c.id; viewManage(); }}, c.name, h('span', {class: 'n'}, c.phrases.length))),
        h('button', {class: 'chip', onclick: () => {
          const name = (prompt('新しいカテゴリ名') || '').trim(); if(!name) return;
          const c = {id: uid(), name, phrases: []}; store.cats.push(c); manageCat = c.id; selected.add(c.id); save(); viewManage();
        }}, '＋ 追加')),
      cat && h('div', {class: 'row wrap'},
        h('button', {class: 'btn ghost small', onclick: () => {
          const name = (prompt('カテゴリ名を変更', cat.name) || '').trim(); if(name){ cat.name = name; save(); viewManage(); }
        }}, '名前を変更'),
        h('button', {class: 'btn ghost small danger', onclick: () => {
          if(confirm(`カテゴリ「${cat.name}」とその中の${cat.phrases.length}フレーズを削除しますか？`)){
            store.cats = store.cats.filter(c => c.id !== cat.id); save(); viewManage();
          }
        }}, 'このカテゴリを削除'))),

    cat && h('div', {class: 'card stack'},
      h('strong', {}, `「${cat.name}」にフレーズを追加`),
      esIn, jaIn,
      h('button', {class: 'btn primary', style: 'padding:14px', onclick: addOne}, '追加'),
      h('details', {},
        h('summary', {class: 'note', style: 'cursor:pointer'}, 'まとめて追加'),
        h('div', {class: 'stack', style: 'margin-top:10px'}, bulk, h('button', {class: 'btn ghost', onclick: addBulk}, 'まとめて追加')))),

    cat && h('div', {class: 'card'},
      h('strong', {}, `登録済み（${cat.phrases.length}）`),
      cat.phrases.length === 0 ? h('div', {class: 'note', style: 'margin-top:8px'}, 'まだフレーズがありません。上のフォームから追加しましょう。') :
      cat.phrases.map(p => h('div', {class: 'pl'},
        h('div', {class: 't'}, h('div', {class: 'es'}, p.es), h('div', {class: 'ja'}, p.ja)),
        h('button', {class: 'ic', 'aria-label': '発音', onclick: () => speak(p.es)}, '🔊'),
        h('button', {class: 'ic', 'aria-label': '編集', onclick: () => {
          const es = prompt('スペイン語', p.es); if(es === null) return;
          const ja = prompt('日本語の意味', p.ja); if(ja === null) return;
          if(es.trim() && ja.trim()){ p.es = es.trim(); p.ja = ja.trim(); save(); viewManage(); }
        }}, '✎'),
        h('button', {class: 'ic danger', 'aria-label': '削除', onclick: () => {
          if(confirm(`「${p.es}」を削除しますか？`)){ cat.phrases = cat.phrases.filter(x => x.id !== p.id); save(); viewManage(); }
        }}, '🗑')))),

    h('div', {class: 'card stack'},
      h('strong', {}, '判定のきびしさ'), level,
      h('div', {class: 'note'}, 'アクセント記号・大文字小文字・句読点は無視して判定します。')),

    h('div', {class: 'card stack'},
      h('strong', {}, 'バックアップ'),
      h('div', {class: 'note'}, 'ブラウザのデータを消すとフレーズも消えます。ときどき書き出しておくと安心です。'),
      h('div', {class: 'row wrap'},
        h('button', {class: 'btn ghost small', onclick: () => {
          const blob = new Blob([JSON.stringify(store, null, 2)], {type: 'application/json'});
          const a = h('a', {href: URL.createObjectURL(blob), download: 'spanish-speak-yet-backup.json'});
          document.body.append(a); a.click(); a.remove();
        }}, '書き出し'),
        h('button', {class: 'btn ghost small', onclick: () => fileIn.click()}, '読み込み'), fileIn))
  ));
}

viewHome();
try{ speechSynthesis.getVoices(); }catch(e){}
</script>
</body>
</html>
